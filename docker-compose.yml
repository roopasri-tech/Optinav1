# SmartRoute - run with:  docker compose up --build
#   App:      http://localhost:8080
#   API docs: http://localhost:8000/docs
# Optional settings (e.g. OPENCHARGEMAP_API_KEY) go in a .env file next to this one - see .env.example.

services:
  db:
    image: postgis/postgis:15-3.4-alpine
    environment:
      POSTGRES_DB: smartroute
      POSTGRES_USER: smartroute
      POSTGRES_PASSWORD: smartroute
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartroute -d smartroute"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://smartroute:smartroute@db:5432/smartroute
      OPENCHARGEMAP_API_KEY: ${OPENCHARGEMAP_API_KEY:-}
      USE_EXTERNAL_FACILITIES: ${USE_EXTERNAL_FACILITIES:-true}
      PETROL_PRICE: ${PETROL_PRICE:-102}
      DIESEL_PRICE: ${DIESEL_PRICE:-90}
      CNG_PRICE: ${CNG_PRICE:-89}
      ELECTRICITY_PRICE: ${ELECTRICITY_PRICE:-18}
      CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080","http://localhost:5173"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
